[project]
name = "msae-train"
version = "0.1.0"
description = "Training scripts for Matryoshka Sparse Autoencoders on CLIP embeddings"
requires-python = "==3.12.*"
dependencies = [
    "torch>=2.5.0",
    "torchvision>=0.20.0",
    "torchaudio>=2.5.0",
    "jupyter>=1.1.1",
    "pytorch-lightning>=2.4.0",
    "tensorboard>=2.17.1",
    "weave>=0.52.23",
    "wandb>=0.24.0",
    "tabulate>=0.9.0",
    "tqdm>=4.66.5",
    "pillow>=10.4.0",
    "notebook>=7.2.2",
    "jupyterlab>=4.2.5",
    "matplotlib>=3.9.2",
    "seaborn>=0.13.2",
    "ipywidgets>=8.1.2",
    "numpy>=1.26.4",
    "scikit-learn>=1.5.2",
    "scipy>=1.12.0",
    "datasets>=3.0.1",
    "transformers>=4.45.2",
    "clip",
    "gdown>=5.2.1",
]

[tool.uv]
package = false

[tool.uv.sources]
clip = { git = "https://github.com/openai/CLIP.git" }
